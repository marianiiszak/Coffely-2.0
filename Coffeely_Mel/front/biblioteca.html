<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Biblioteca | Coffeely</title>

  <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/homela" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="biblioteca.css">
</head>

<body>

<header class="navbar">

  <div class="nav-left">
    <img src="logo.png" class="logo">
  </div>

  <nav class="nav-center">
    <a href="#" class="nav-btn destaque">Biblioteca</a>
    <a href="descubra.html" class="nav-btn">Descubra</a>
    <a href="resenhas.html" class="nav-btn">Resenhas</a>
    <a href="#" class="nav-btn">Cafeteria</a>
  </nav>

  <div class="nav-right">
    <div style="width:45px;height:45px;background:#e58f8f;border-radius:50%;"></div>
  </div>

</header>

<main class="biblioteca-container">

  <div class="titulo-wrapper">
    <img src="estrelas1.png" class="estrela-decor">
    <h1 class="titulo-biblioteca">Minha Biblioteca</h1>
    <img src="estrelas2.png" class="estrela-decor">
  </div>

  <div class="controle-biblioteca">

    <div class="filtros-wrapper">

      <button class="filtro ativo" id="filtro-prateleiras">
        Prateleiras
      </button>

      <button class="filtro" id="filtro-todos">
        Todos os livros
      </button>

    </div>

    <div class="busca-wrapper">

      <input
        type="text"
        class="busca"
        placeholder="Pesquisar livros..."
      >

    </div>

  </div>

  <section id="conteudo-biblioteca"></section>

</main>

<button class="btn-add">+</button>

<footer class="footer-biblioteca">
  © 2025 Coffeely
</footer>


<!-- ================= MODAL ================= -->

<div class="modal-overlay" id="modalAdicionarBiblioteca">

  <div class="modal-livro">

    <button
      class="modal-fechar"
      id="fecharAdicionarBiblioteca">
      ×
    </button>

    <h2 class="feedback-titulo">
      Adicionar Livro
    </h2>

    <input
      id="buscarLivro"
      type="text"
      placeholder="Pesquisar livro..."
      class="modal-input">

    <div id="listaLivrosModal">
      <p id="nomeLivroEscolhido"></p>
    </div>

    <div id="livroEscolhido" style="display:none;">

      <h3 id="nomeLivroEscolhido"></h3>

      <label>Prateleira</label>

      <select
        id="categoriaModal"
        class="modal-input-select">

        <option value="Quero Ler">
          Quero Ler
        </option>

        <option value="Lendo">
          Lendo
        </option>

        <option value="Lidos">
          Lidos
        </option>

        <option value="Em Pausa">
          Em Pausa
        </option>

      </select>

      <button
        id="adicionarBiblioteca"
        class="btn-salvar">

        Adicionar à Biblioteca

      </button>

    </div>

  </div>

</div>

<script src="biblioteca.js"></script>

</body>
</html>
